# Model comparison and final model settings (Step 5)
seed: 42
# Stratified (stratify=y) 70:15:15 split, saved as data/processed/split.csv (row_id, split).
# train: model comparison with 5-fold CV. validation: decisions (monotonic loss; any future
# threshold or fairness tuning). test: touched once, by the shipped model (fit on train+validation).
split: {train: 0.70, validation: 0.15, test: 0.15, seed: 42}
n_splits: 5                 # CV inside train, stratified on target x thin_filer; same folds for every run
cv_repeats: 1               # >1 repeats the folds with new shuffles (more ANOVA replicates); off by default
data: data/processed/gmsc_sim.csv
target: SeriousDlqin2yrs
thin_col: thin_filer
model_names: [lr, lgbm, xgb]
# Model file names: models/{full_name}_v{model_version}.joblib  (e.g. models/xgboost_v1.0.joblib)
model_version: "1.0"
model_full_names: {lr: logistic_regression, lgbm: lightgbm, xgb: xgboost}
feature_sets: [gmsc, alt, both]
resampling: [none, class_weight, smote]
# Fixed hyperparameters (no per-run tuning, so the grid compares methods, not tuning effort)
models:
  lr:   {max_iter: 2000, C: 1.0}
  lgbm: {n_estimators: 300, learning_rate: 0.05, num_leaves: 31, min_child_samples: 50}
  xgb:  {n_estimators: 300, learning_rate: 0.05, max_depth: 5, min_child_weight: 5, tree_method: hist}
# LR only: log1p then cap at the training fold's quantile (fit inside the fold)
lr_log_cap_columns: [RevolvingUtilizationOfUnsecuredLines, DebtRatio, MonthlyIncome]
lr_cap_quantile: 0.99
# Winner: highest AUC among 'both' runs; runs within 1 fold SD of it count as ties,
# and ties go to the earlier resampling option in this list.
resampling_preference: [none, class_weight, smote]
monotonic:
  models: [lgbm, xgb]
  max_auc_loss: 0.01
  drop_order: [DebtRatio, MonthlyIncome, RevolvingUtilizationOfUnsecuredLines]
# Platt, only if the winner uses class weights or SMOTE: CalibratedClassifierCV with internal CV,
# refit on train+validation, so the test set evaluates exactly the shipped object.
calibration: {method: sigmoid, cv: 3}
bootstrap: {n: 500, seed: 42}           # 95% CIs on validation and test metrics
mlflow:
  # Tracking URI: env var MLFLOW_TRACKING_URI if set (e.g. the docker-compose MLflow server),
  # else a local SQLite db + artifacts in ./mlruns (gitignored, relative to the project root).
  tracking_dir: mlruns
  experiments:                          # one experiment per algorithm, plus final and audit
    lr: nextstep-lr
    lgbm: nextstep-lgbm
    xgb: nextstep-xgb
    final: nextstep-final
    audit: nextstep-audit
outputs:
  comparison: reports/model_comparison.csv
  cv_fold_auc: reports/cv_fold_auc.csv   # ANOVA handoff: run, model, features, resampling, repeat, fold, segment, n_rows, n_defaults, auc
  monotonic: reports/monotonic_results.csv
  final_summary: reports/final_summary.json
  grade_table: reports/grade_table.csv
  split: data/processed/split.csv
  test_scores: data/processed/final_test_scores.csv
  model: "models/{full_name}_v{version}.joblib"
