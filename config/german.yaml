# German Credit secondary model (separate from the GMSC pipeline). Educational use only.
source:
  name: Statlog (German Credit Data), UCI Machine Learning Repository, dataset id 144
  url: https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.data
  citation: "Hofmann, H. (1994). Statlog (German Credit Data) [Dataset]. UCI Machine Learning Repository. https://doi.org/10.24432/C5NC77"
  license: CC BY 4.0
raw_path: data/raw/german.data
# Column names for the 20 attributes + target, in file order
columns: [checking_status, duration_months, credit_history, purpose, credit_amount, savings,
          employment_since, installment_rate, personal_status_sex, other_debtors, residence_since,
          property, age, other_installment_plans, housing, existing_credits, job, people_liable,
          telephone, foreign_worker, target]
numeric: [duration_months, credit_amount, installment_rate, residence_since, age, existing_credits, people_liable]
# Target: original 1 = good, 2 = bad  ->  default = 1 if bad
bad_code: 2
# Sex from attribute 9: only A92 is female in the data (A95, single female, never occurs)
female_codes: [A92]
# Not model features; kept in the OOF file for evaluation
exclude_from_features: [personal_status_sex, foreign_worker]
# Monotonic constraints only where the direction is clear AND the binned data agrees.
# credit_amount is U-shaped in the data (30%, 24%, 27%, 26%, 43% by quintile), so unconstrained.
# age stays an unconstrained feature, same as the GMSC model.
monotone: {duration_months: 1, installment_rate: 1}
cv: {n_splits: 5, n_repeats: 10, seed: 42}
models:
  lr:  {C: 1.0, max_iter: 2000}
  xgb: {n_estimators: 300, learning_rate: 0.05, max_depth: 3, min_child_weight: 5,
        subsample: 0.8, colsample_bytree: 0.8, tree_method: hist}
# UCI cost matrix: approving a bad borrower costs 5, rejecting a good one costs 1
cost_matrix: {approve_bad: 5, reject_good: 1}
outputs:
  oof: reports/german/oof_predictions.csv
  metrics: reports/german/metrics.json
labels:
  checking_status: {A11: "< 0 DM", A12: "0 to 200 DM", A13: ">= 200 DM or salary assignment", A14: no checking account}
  credit_history: {A30: no credits or all paid back duly, A31: all credits at this bank paid back duly, A32: existing credits paid back duly so far, A33: delay in paying off in the past, A34: critical account or other credits elsewhere}
  purpose: {A40: car (new), A41: car (used), A42: furniture/equipment, A43: radio/television, A44: domestic appliances, A45: repairs, A46: education, A47: vacation, A48: retraining, A49: business, A410: others}
  savings: {A61: "< 100 DM", A62: "100 to 500 DM", A63: "500 to 1000 DM", A64: ">= 1000 DM", A65: unknown or no savings account}
  employment_since: {A71: unemployed, A72: "< 1 year", A73: "1 to 4 years", A74: "4 to 7 years", A75: ">= 7 years"}
  personal_status_sex: {A91: "male: divorced/separated", A92: "female: divorced/separated/married", A93: "male: single", A94: "male: married/widowed", A95: "female: single"}
  other_debtors: {A101: none, A102: co-applicant, A103: guarantor}
  property: {A121: real estate, A122: building society savings or life insurance, A123: car or other, A124: unknown or no property}
  other_installment_plans: {A141: bank, A142: stores, A143: none}
  housing: {A151: rent, A152: own, A153: for free}
  job: {A171: unemployed or unskilled non-resident, A172: unskilled resident, A173: skilled employee or official, A174: "management, self-employed or highly qualified"}
  telephone: {A191: none, A192: "yes, registered under customer name"}
  foreign_worker: {A201: "yes", A202: "no"}
