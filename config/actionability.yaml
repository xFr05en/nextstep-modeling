version: '0.2'
author: 김원빈
date: '2026-10-05'
conventions:
  target: SeriousDlqin2yrs
  model_output: probability_of_default
  monotone: +1 = feature up -> PD up; -1 = feature up -> PD down; 0 = none
  months_per_step: team assumption, subject to sensitivity analysis
classes:
  ACTIONABLE:
    label_ko: 조치 가능
    label_en: Actionable
    definition_ko: "신청자가 행동으로 직접 바꿀 수 있음"
    definition_en: "Applicant can change it directly through action"
    recourse: 승인 경로에 포함
    recourse_en: Included in approval paths
  CONDITIONAL:
    label_ko: 조건부 조치 가능
    label_en: Conditionally actionable
    definition_ko: "바꿀 수 있지만 어렵거나 외부 요인(고용, 소득)에 좌우됨"
    definition_en: "Changeable but difficult or dependent on external factors (employment, income)"
    recourse: 포함하되 높은 비용 부여
    recourse_en: Included with a high cost
  TIME_ONLY:
    label_ko: 시간 의존
    label_en: Time-dependent
    definition_ko: "행동이 아니라 시간이 지나야만 바뀜"
    definition_en: "Changes only with the passage of time, not through action"
    recourse: 포함 시 기간만 반영, 행동 권유 문구 사용 금지
    recourse_en: If included, reflect duration only; do not phrase as an action
  NON_DECREASING:
    label_ko: 감소 불가
    label_en: Non-decreasing
    definition_ko: "줄일 수 없는 과거 이력(증가만 가능)"
    definition_en: "Past history that cannot be reduced (can only increase)"
    recourse: DiCE에서 고정
    recourse_en: Fixed in DiCE
  IMMUTABLE:
    label_ko: 불변
    label_en: Immutable
    definition_ko: "바꿀 수 없음(연령, 부양가족 수 등)"
    definition_en: "Cannot be changed (age, dependents, etc.)"
    recourse: DiCE에서 고정, 거절 사유에서 '참고(변경 불가)'로 표기
    recourse_en: Fixed in DiCE; shown as 'reference (not changeable)' in rejection reasons
  NOT_RECOMMENDED:
    label_ko: 권장 불가
    label_en: Not recommended
    definition_ko: "기술적으로는 바꿀 수 있지만 권유가 부적절하거나 부작용이 있음"
    definition_en: "Technically changeable but inappropriate to suggest or has side effects"
    recourse: DiCE에서 고정
    recourse_en: Fixed in DiCE
features:
  RevolvingUtilizationOfUnsecuredLines:
    label_ko: 리볼빙 한도 사용률
    label_en: Revolving credit utilization rate
    note_ko: "카드·신용한도 잔액을 갚으면 낮출 수 있음. 단계당 기간은 0.05 감소 기준. 업데이트(1단계): 원래 1 초과 값을 1로 자를 계획이었으나, 한도 초과 사용은 현실적이므로 1 초과는 유지하고 10 초과만 오류로 보아 결측 처리(util_outlier 플래그). 이에 맞춰 허용 범위를 [0, 10]으로 확대. 2단계: 10분위별 부도율 약 1.4%에서 23.4%로 증가."
    note_en: "Can be lowered by paying down card and credit line balances. Time per step assumes a 0.05 decrease. Update (Step 1): the original plan was to clip values above 1 to 1; instead, values above 1 are kept (over-limit use is realistic) and only values above 10 are treated as errors (set missing, util_outlier flag). Bounds widened to [0, 10] to match. Step 2: default rate rises from about 1.4% to 23.4% across deciles."
    source: gmsc
    actionability: ACTIONABLE
    direction: decrease
    step: 0.05
    bounds:
    - 0.0
    - 10.0
    difficulty: 2
    months_per_step: 1.0
    monotone: 1
    protected: false
    dice_vary: true
  age:
    label_ko: 연령
    label_en: Age
    note_ko: "보호 속성. 바꿀 수 없으므로 단조 제약 불필요(제약은 AUC만 낮춤). 업데이트: 단조 제약 없이 모델 변수로 사용하기로 결정. 연령 0인 1행은 1단계에서 삭제. 공정성 참고: 연령은 리볼빙 사용률(-0.28), 부양가족 수(-0.23)와 관련되고 대체 변수와도 약하게 관련(0.05~0.09)되므로, 연령을 빼도 연령 효과가 완전히 사라지지 않음."
    note_en: "Protected attribute. Immutable, so no monotonic constraint needed (a constraint would only cost AUC). Update: decided to use it as a model feature without a monotonic constraint. The one row with age = 0 was dropped in Step 1. Fairness note: age correlates with utilization (-0.28) and dependents (-0.23), and weakly with the alternative variables (0.05 to 0.09), so removing age alone would not remove age effects."
    source: gmsc
    actionability: IMMUTABLE
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: true
    dice_vary: false
  NumberOfTime30-59DaysPastDueNotWorse:
    label_ko: 30~59일 연체 횟수(최근 2년)
    label_en: Times 30 to 59 days past due (last 2 years)
    note_ko: "헌장 규칙 적용: 연체 이력은 감소 불가. 2년 기간 때문에 시간이 지나면 줄 수 있으나 v1에서는 고정. 업데이트(1단계): 96/98 코드(269행, 세 열 동시)는 결측 처리하고 pastdue_special_code로 표시(부도율 54.65%)."
    note_en: "Charter rule applies: late-payment history cannot decrease. It could drop over time due to the 2-year window, but is fixed in v1. Update (Step 1): codes 96/98 (269 rows, always in all three columns together) set to missing and flagged in pastdue_special_code (default rate 54.65%)."
    source: gmsc
    actionability: NON_DECREASING
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 1
    protected: false
    dice_vary: false
  DebtRatio:
    label_ko: 부채비율(월 부채상환+생활비/월소득)
    label_en: Debt ratio (monthly debt payments + living costs / monthly income)
    note_ko: "부채 상환이나 소득 증가가 필요. 소득 결측 행은 비정상적으로 큰 값. 업데이트: 1단계에서 소득이 결측이거나 0이면 결측 처리(비율이 아닌 금액이므로). 2단계에서 U자형으로 방향 근거가 가장 약해 제약 제거 1순위로 지정. 5단계에서 제약 비용이 AUC 0.0001에 불과해 +1 제약 유지."
    note_en: "Requires paying down debt or raising income. Rows with missing MonthlyIncome have abnormally large values. Update: Step 1 sets it to missing when income is missing or 0 (raw amounts, not ratios). Step 2 found a U shape, the weakest direction evidence, so it was first in the drop order. Step 5: the constraint cost only 0.0001 AUC, so +1 was kept."
    source: gmsc
    actionability: CONDITIONAL
    direction: decrease
    step: 0.05
    bounds:
    - 0.0
    - null
    difficulty: 3
    months_per_step: 3.0
    monotone: 1
    protected: false
    dice_vary: true
  MonthlyIncome:
    label_ko: 월 소득
    label_en: Monthly income
    note_ko: "변경 가능하지만 외부 요인(고용)에 좌우됨. 통화 문제를 피하려고 단위를 비율(5%)로 정의. 업데이트(1단계): 결측(19.8%)은 결측으로 두고 income_missing으로 표시, 0은 실제 값으로 두고 income_zero로 표시. 대체(중앙값)는 학습 폴드에서만 계산."
    note_en: "Changeable but depends on external factors (employment). Step defined as a percentage (5%) to avoid currency issues. Update (Step 1): missing values (19.8%) kept as missing with the income_missing flag; 0 kept as a real value with the income_zero flag. Imputation (median) is fit on training folds only."
    source: gmsc
    actionability: CONDITIONAL
    direction: increase
    step: 5%
    bounds:
    - 0.0
    - null
    difficulty: 3
    months_per_step: 6.0
    monotone: -1
    protected: false
    dice_vary: true
  NumberOfOpenCreditLinesAndLoans:
    label_ko: 보유 대출·신용한도 수
    label_en: Number of open loans and credit lines
    note_ko: "부도와 U자형 관계라 방향 제약 없음. 카드를 해지하면 사용률이 오르고, 새 계좌 개설 권유는 부적절. v1 경로에서 제외. 업데이트: 2단계에서 U자형 확인(3개 이하에서 부도율 최고). 씬파일러 규칙(2개 이하, 부동산 담보대출 0)에도 사용."
    note_en: "U-shaped relationship with default, so no direction constraint. Closing a card raises utilization; suggesting new accounts is inappropriate. Excluded from v1 paths. Update: Step 2 confirmed the U shape (highest default rate at 3 or fewer lines). Also used in the thin-filer rule (2 or fewer lines and 0 real estate loans)."
    source: gmsc
    actionability: NOT_RECOMMENDED
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: false
    dice_vary: false
  NumberOfTimes90DaysLate:
    label_ko: 90일 이상 연체 횟수
    label_en: Times 90+ days late
    note_ko: "기간 제한 없는 누적 이력. 감소 불가. 업데이트: 96/98 코드는 30~59일 열과 같이 처리. 실제 변수 중 가장 강한 예측 변수(Pearson r 0.315)."
    note_en: "Cumulative history with no time window. Cannot decrease. Update: codes 96/98 handled as for the 30 to 59 day column. Strongest real predictor (Pearson r 0.315)."
    source: gmsc
    actionability: NON_DECREASING
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 1
    protected: false
    dice_vary: false
  NumberRealEstateLoansOrLines:
    label_ko: 부동산 담보대출 수
    label_en: Number of real estate loans
    note_ko: "주택담보대출을 승인 경로로 제안하는 것은 비현실적. 비단조 관계. 업데이트: 2단계에서 U자형 확인. 씬파일러 규칙에도 사용."
    note_en: "Suggesting a mortgage as an approval path is unrealistic. Non-monotonic relationship. Update: Step 2 confirmed the U shape. Also used in the thin-filer rule."
    source: gmsc
    actionability: NOT_RECOMMENDED
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: false
    dice_vary: false
  NumberOfTime60-89DaysPastDueNotWorse:
    label_ko: 60~89일 연체 횟수(최근 2년)
    label_en: Times 60 to 89 days past due (last 2 years)
    note_ko: "30~59일 연체와 같은 규칙."
    note_en: "Same rule as 30 to 59 days past due."
    source: gmsc
    actionability: NON_DECREASING
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 1
    protected: false
    dice_vary: false
  NumberOfDependents:
    label_ko: 부양가족 수
    label_en: Number of dependents
    note_ko: "가족 수를 바꾸라고 권하는 것은 비윤리적이므로 불변으로 처리. 업데이트: 결측 2.6%는 학습 폴드 중앙값으로 대체."
    note_en: "Advising someone to change family size is unethical, so treated as immutable. Update: 2.6% missing, imputed with the training-fold median."
    source: gmsc
    actionability: IMMUTABLE
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: false
    dice_vary: false
  telecom_ontime_rate:
    label_ko: 통신요금 정시납부율(최근 12개월)
    label_en: Phone bill on-time payment rate (last 12 months)
    note_ko: "정시 납부한 달마다 1/12씩 오름. 분포는 베타 제안. 목표 상관 -0.3~-0.5. 업데이트(3단계): Beta(8, 1.5) 분포, 코퓰라 잠재 상관 -0.35, 관측 Pearson -0.27. 신용 행동과 연결(가중치 1.0, b = 0.30)."
    note_en: "Rises by 1/12 for each month paid on time. Suggested distribution: Beta. Target correlation -0.3 to -0.5. Update (Step 3): Beta(8, 1.5) marginal, copula latent correlation -0.35, observed Pearson -0.27. Linked to credit behavior (weight 1.0, b = 0.30)."
    source: simulated
    actionability: ACTIONABLE
    direction: increase
    step: 0.0833
    bounds:
    - 0.0
    - 1.0
    difficulty: 1
    months_per_step: 1.0
    monotone: -1
    protected: false
    dice_vary: true
  utility_ontime_rate:
    label_ko: 공과금(전기·가스·수도) 정시납부율(최근 12개월)
    label_en: Utility bill (electricity, gas, water) on-time rate (last 12 months)
    note_ko: "통신요금 납부율과 상관이 높을 가능성. 둘 사이 상관도 확인 필요. 목표 상관 -0.3~-0.5. 업데이트(3단계): 통신요금 납부율과 같은 설정. 둘 사이 상관 0.19(상한 0.60)로 잡음 추가 불필요."
    note_en: "Likely highly correlated with the phone bill rate; check the correlation between them too. Target correlation -0.3 to -0.5. Update (Step 3): same setup as the phone bill rate. Correlation between the two is 0.19 (cap 0.60), so no extra noise was needed."
    source: simulated
    actionability: ACTIONABLE
    direction: increase
    step: 0.0833
    bounds:
    - 0.0
    - 1.0
    difficulty: 1
    months_per_step: 1.0
    monotone: -1
    protected: false
    dice_vary: true
  telecom_tenure_months:
    label_ko: 통신사 가입 유지 기간(개월)
    label_en: Months with current phone carrier
    note_ko: "행동으로 앞당길 수 없고 시간이 지나야만 증가. 분포는 감마 또는 로그정규 제안. 업데이트(3단계): Gamma(2, 24) 분포, (연령 - 18) × 12개월 상한(0.69% 행에 적용). 연령과의 상관 0.065. 신용 연결 가중치 0.5."
    note_en: "Cannot be sped up by action; increases only with time. Suggested distribution: Gamma or lognormal. Update (Step 3): Gamma(2, 24) marginal, capped at (age - 18) x 12 months (applies to 0.69% of rows). Correlation with age 0.065. Credit-link weight 0.5."
    source: simulated
    actionability: TIME_ONLY
    direction: increase
    step: 1
    bounds:
    - 0
    - 240
    difficulty: 1
    months_per_step: 1.0
    monotone: -1
    protected: false
    dice_vary: true
  insurance_paid_months:
    label_ko: 건강보험·국민연금 납부 개월수(최근 24개월)
    label_en: Health insurance / national pension payment months (last 24 months)
    note_ko: "가입(직장 또는 지역)이 필요하며 시간이 지나야만 증가. 국내 대안신용평가에서 쓰이는 유형의 변수. 업데이트(3단계): Binomial(24, 0.75) 분포, 잠재 상관 -0.35, 신용 연결 가중치 0.5."
    note_en: "Requires enrollment (employment or regional). Increases only with time. A type of variable used in Korean alternative credit scoring. Update (Step 3): Binomial(24, 0.75) marginal, latent correlation -0.35, credit-link weight 0.5."
    source: simulated
    actionability: TIME_ONLY
    direction: increase
    step: 1
    bounds:
    - 0
    - 24
    difficulty: 2
    months_per_step: 1.0
    monotone: -1
    protected: false
    dice_vary: true
  autopay_ratio:
    label_ko: 정기 청구서 자동이체 등록 비율
    label_en: Share of recurring bills on autopay
    note_ko: "즉시 바꿀 수 있어 '쉬운 경로'가 됨. 그러나 자동이체 설정이 실제 위험을 낮추지는 않아 악용 우려가 있음. 경로 포함 여부는 팀 결정. 업데이트: 아직 미결정으로 현재는 조치 가능(ACTIONABLE). 3단계: 6단계 이산 분포, 잠재 상관 -0.35, 신용 연결 가중치 0.5."
    note_en: "Can be changed immediately, creating an 'easy path'. But setting autopay does not lower real risk, so there is a gaming concern. Team to decide on inclusion in paths. Update: still open, classified ACTIONABLE for now. Step 3: 6-step discrete marginal, latent correlation -0.35, credit-link weight 0.5."
    source: simulated
    actionability: ACTIONABLE
    direction: increase
    step: 0.2
    bounds:
    - 0.0
    - 1.0
    difficulty: 1
    months_per_step: 0.5
    monotone: -1
    protected: false
    dice_vary: true
  pastdue_special_code:
    label_ko: 연체 횟수 특수코드(96/98) 표시
    label_en: Past-due special code (96/98) flag
    note_ko: "1단계에서 추가. 연체 횟수 3개 열이 모두 96/98(횟수가 아닌 특수코드)인 269행 표시. 부도율 54.65%로 신호가 강함. 과거 이력에서 나오므로 불변."
    note_en: "Added in Step 1. Marks the 269 rows where all three past-due columns hold 96/98 (special codes, not counts). Default rate 54.65%, so it carries strong signal. Derived from history, so immutable."
    source: derived
    actionability: IMMUTABLE
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: false
    dice_vary: false
  income_missing:
    label_ko: 월 소득 결측 표시
    label_en: Monthly income missing flag
    note_ko: "1단계에서 추가. 소득 결측 29,731행(19.8%) 표시. 이 행들은 부채비율이 금액이므로 부채비율도 결측 처리. 부도율 5.6%."
    note_en: "Added in Step 1. Marks 29,731 rows (19.8%) with missing income. DebtRatio is also set to missing there because it holds raw amounts. Default rate 5.6%."
    source: derived
    actionability: IMMUTABLE
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: false
    dice_vary: false
  income_zero:
    label_ko: 월 소득 0 표시
    label_en: Monthly income equals zero flag
    note_ko: "1단계에서 추가. 소득 0인 1,634행 표시(0은 실제 값으로 유지). 이 행들의 부채비율은 결측 처리. 부도율 4.0%."
    note_en: "Added in Step 1. Marks 1,634 rows with income = 0 (kept as a real value). DebtRatio set to missing there. Default rate 4.0%."
    source: derived
    actionability: IMMUTABLE
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: false
    dice_vary: false
  util_outlier:
    label_ko: 리볼빙 사용률 이상치(10 초과) 표시
    label_en: Revolving utilization outlier (above 10) flag
    note_ko: "1단계에서 추가. 리볼빙 사용률 10 초과 241행 표시(데이터 오류로 보고 결측 처리). 부도율 7.05%로 평균과 비슷해 시뮬레이터에서는 중립 신용 점수 부여."
    note_en: "Added in Step 1. Marks 241 rows with utilization above 10 (treated as data errors, set to missing). Default rate 7.05%, close to average, so the simulator gives them a neutral credit score."
    source: derived
    actionability: IMMUTABLE
    direction: none
    step: null
    bounds: null
    difficulty: null
    months_per_step: null
    monotone: 0
    protected: false
    dice_vary: false
  gender_female:
